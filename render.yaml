## render.yaml — Blueprint Solar Inspection Platform
## https://render.com/docs/blueprint-spec

services:
  # ── Backend FastAPI ──────────────────────────────────────────────────────────
  - type: web
    name: solar-inspection-platform
    runtime: docker
    region: frankfurt
    plan: starter
    healthCheckPath: /health
    # Migrations lancées AVANT le démarrage (évite asyncio.run dans lifespan)
    preDeployCommand: "cd /app && alembic upgrade head"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: solar-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: solar-redis
          type: redis
          property: connectionString
      - key: FRONTEND_URL
        value: "https://solar-inspection-platform.onrender.com"
      - key: DEBUG
        value: "false"

  # ── Frontend React (site statique CDN) ──────────────────────────────────────
  - type: web
    name: solar-frontend
    runtime: static
    rootDir: src/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_API_URL
        value: "https://solar-inspection-platform.onrender.com/api/v1"

  # ── Redis / Key-Value ────────────────────────────────────────────────────────
  - type: redis
    name: solar-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru

# ── PostgreSQL + PostGIS ─────────────────────────────────────────────────────
databases:
  - name: solar-db
    databaseName: solar_inspection
    plan: starter
    region: frankfurt
