## render.yaml — Blueprint Solar Inspection Platform
## https://render.com/docs/blueprint-spec

services:
  # ── Backend FastAPI ──────────────────────────────────────────────────────────
  - type: web
    name: solar-inspection-platform
    runtime: docker
    region: frankfurt
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: solar-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: solar-redis
          type: keyvalue
          property: connectionString
      - key: FRONTEND_URL
        value: "https://solar-inspection-platform.onrender.com"
      - key: DEBUG
        value: "false"

  # ── Frontend React (site statique CDN) ──────────────────────────────────────
  - type: web
    name: solar-frontend
    runtime: static
    rootDir: src/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://solar-inspection-platform-5jm2.onrender.com/api/v1"

  # ── Key Value (Redis-compatible) ─────────────────────────────────────────────
  - type: keyvalue
    name: solar-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

# ── PostgreSQL ────────────────────────────────────────────────────────────────
databases:
  - name: solar-db
    databaseName: solar_inspection
    plan: free
    region: frankfurt
